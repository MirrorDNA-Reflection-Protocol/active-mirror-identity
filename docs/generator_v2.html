<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRROR SEED v2 — Verifiable Identity Protocol | MirrorDNA</title>
    <meta name="description" content="Create a verifiable, cryptographic identity file for your AI interactions. Owned by you, verified by code.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#050505;--bg-card:#0d0d0d;--bg-input:#141414;--border:#1f1f1f;--border-hover:#2a2a2a;--text:#fafafa;--text-secondary:#888;--text-dim:#555;--accent:#00ff94;--accent-glow:rgba(0,255,148,.15);--accent-subtle:rgba(0,255,148,.08);--gradient:linear-gradient(135deg,#00ff94 0%,#00d4ff 50%,#a855f7 100%);--warning:#ff6b6b;--success:#00ff94;--error:#ff4444}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
        .bg-gradient{position:fixed;top:0;left:0;right:0;height:100vh;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(0,255,148,.12),transparent),radial-gradient(ellipse 60% 40% at 80% 60%,rgba(168,85,247,.08),transparent);pointer-events:none;z-index:-1}
        .container{max-width:800px;margin:0 auto;padding:2rem 1.5rem}
        .hero{text-align:center;padding:4rem 0 2rem}
        .hero-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;background:var(--accent-subtle);border:1px solid rgba(0,255,148,.2);border-radius:100px;font-size:.85rem;color:var(--accent);margin-bottom:1.5rem}
        .hero h1{font-size:clamp(2.5rem,6vw,3.5rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:1rem;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hero p{font-size:1.25rem;color:var(--text-secondary);max-width:520px;margin:0 auto}
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:2rem;margin-bottom:1.5rem}
        .tabs{display:flex;gap:.5rem;background:var(--bg-input);padding:.5rem;border-radius:12px;margin-bottom:2rem}
        .tab-btn{flex:1;padding:.75rem 1rem;border-radius:10px;font-size:.95rem;font-weight:600;color:var(--text-secondary);cursor:pointer;text-align:center;border:none;background:transparent;transition:all .2s}
        .tab-btn:hover{color:var(--text);background:rgba(255,255,255,0.05)}
        .tab-btn.active{background:var(--bg-card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
        .tab-content{display:none}
        .tab-content.active{display:block;animation:fadeIn .3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        
        /* Generator Form Styles */
        .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
        .field{display:flex;flex-direction:column}
        .field.full{grid-column:span 2}
        .field label{font-size:.85rem;font-weight:500;margin-bottom:.5rem;color:var(--text-secondary)}
        .field input,.field textarea,.field select{padding:.875rem 1rem;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.95rem;font-family:inherit;transition:all .2s}
        .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-subtle)}
        
        /* Parsing & Verification Area */
        .drop-zone{border:2px dashed var(--border);border-radius:12px;padding:3rem 2rem;text-align:center;color:var(--text-secondary);transition:all .2s;cursor:pointer;margin-bottom:1.5rem}
        .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:var(--accent-subtle)}
        .paste-area{width:100%;height:200px;background:var(--bg-input);border:1px solid var(--border);border-radius:12px;padding:1rem;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.9rem;resize:vertical;margin-bottom:1rem}
        
        .result-box{background:var(--bg-input);border-radius:12px;padding:1.5rem;margin-top:1.5rem}
        .status-header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
        .status-icon{font-size:1.5rem}
        .status-title{font-size:1.2rem;font-weight:700}
        .status-pass{color:var(--success)}
        .status-fail{color:var(--error)}
        
        .detail-row{display:flex;justify-content:space-between;padding:.5rem 0;font-size:.9rem;border-bottom:1px solid #1a1a1a}
        .detail-label{color:var(--text-secondary)}
        .detail-val{font-family:'JetBrains Mono',monospace}
        .warning-box{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.2);border-radius:8px;padding:1rem;margin-top:1rem;color:var(--warning);font-size:.9rem}
        
        .btn{display:inline-flex;align-items:center;justify-content:center;padding:1rem 2rem;border-radius:12px;background:var(--accent);color:#000;font-weight:700;border:none;cursor:pointer;font-size:1rem;transition:transform .2s}
        .btn:hover{transform:translateY(-2px)}
        
        footer{margin-top:4rem;text-align:center;color:var(--text-dim);font-size:.9rem}
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="container">
        <section class="hero">
            <div class="hero-badge">v2.0 Beta · Verifiable</div>
            <h1>Mirror Seed Generator</h1>
            <p>Create cryptographically verifiable identity files for resilient AI continuity.</p>
        </section>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('create')">Create New Seed</button>
            <button class="tab-btn" onclick="switchTab('verify')">Verify Existing</button>
        </div>

        <div id="tab-create" class="tab-content active">
            <div class="card">
                <div class="form-grid">
                    <div class="field"><label>Your Name</label><input type="text" id="genName" placeholder="Paul Desai"></div>
                    <div class="field"><label>Role / Title</label><input type="text" id="genRole" placeholder="AI Architect"></div>
                    <div class="field full"><label>Core Directives (AI Instructions)</label><textarea id="genInst" placeholder="Be direct. Ground responses in first principles. No fluff."></textarea></div>
                    <div class="field full"><label>Context / Current Focus</label><textarea id="genContext" placeholder="Building the Mirror Seed Protocol v2..."></textarea></div>
                </div>
                <div style="margin-top:1.5rem;text-align:center">
                    <button class="btn" onclick="generateSeed()">Generate Signed Seed</button>
                </div>
                <div id="output-area" style="display:none;margin-top:2rem;">
                    <textarea class="paste-area" id="seedOutput" readonly></textarea>
                    <div style="font-size:0.85rem;color:var(--text-secondary);text-align:center">
                        SHA-256 Checksum computed and embedded. Saved to clipboard on Generate.
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-verify" class="tab-content">
            <div class="card">
                <div class="drop-zone" id="dropZone">
                    Drag & Drop your .md seed file here
                </div>
                <div style="text-align:center;margin-bottom:1rem;color:var(--text-dim)">OR</div>
                <textarea class="paste-area" id="verifyInput" placeholder="Paste your Mirror Seed content here..."></textarea>
                <div style="text-align:center">
                    <button class="btn" onclick="verifySeed()" style="background:var(--bg-input);color:var(--text);border:1px solid var(--border)">Verify Integrity</button>
                </div>
                
                <div id="verifyResult" class="result-box" style="display:none"></div>
            </div>
        </div>

        <footer>
            Active MirrorOS · MirrorDNA Trust by Design · v2.0
        </footer>
    </div>

    <script>
        // --- CRYPTO UTILS ---
        async function computeChecksum(content) {
            const encoder = new TextEncoder();
            const data = encoder.encode(content);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return 'sha256:' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // --- PARSER LOGIC (Ported from PARSER.js) ---
        class MirrorParser {
            static parse(text) {
                const parts = text.split(/^---$/m);
                if (parts.length < 3) return { valid: false, error: "Invalid structure (missing frontmatter)" };
                
                try {
                    const frontmatter = this.parseYAML(parts[1]);
                    const content = parts.slice(2).join('---').trim();
                    return { valid: true, frontmatter, content };
                } catch(e) {
                    return { valid: false, error: e.message };
                }
            }

            static parseYAML(yamlText) {
                const result = {};
                const lines = yamlText.trim().split('\n');
                let currentKey = null;
                for (const line of lines) {
                    if (line.trim().startsWith('#') || !line.trim()) continue;
                    const match = line.match(/^(\s*)([a-z_]+):\s*(.*)$/i);
                    if (match) {
                        const [, spaces, key, value] = match;
                        if (value) {
                            result[key.trim()] = value.replace(/^["']|["']$/g, '').trim();
                        } else {
                            result[key.trim()] = {};
                            currentKey = key.trim();
                        }
                    } else if (currentKey && line.includes(':')) {
                        // Simple nested handling for lineage
                        const [k, v] = line.split(':');
                        if (k && v) result[currentKey][k.trim()] = v.replace(/^["']|["']$/g, '').trim();
                    }
                }
                return result;
            }
        }

        // --- UI LOGIC ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-'+tab).classList.add('active');
        }

        async function generateSeed() {
            const name = document.getElementById('genName').value || 'User';
            const role = document.getElementById('genRole').value || 'Undefined';
            const inst = document.getElementById('genInst').value || '';
            const ctx = document.getElementById('genContext').value || '';
            const date = new Date().toISOString();
            const seedId = 'seed-' + Date.now().toString(36);
            
            // 1. Build Body content first
            let body = `# MIRROR SEED\n\n## Identity\nName: ${name}\nRole: ${role}\n\n`;
            if (inst) body += `## Instructions\n${inst}\n\n`;
            if (ctx) body += `## Context\n${ctx}\n\n`;
            body += `---\n⟡ MirrorDNA-Seed-v2 | ${seedId}`;

            // 2. Compute Checksum of body
            const checksum = await computeChecksum(body);

            // 3. Build Frontmatter with Checksum
            const frontmatter = `version: "2.0.0"\nseed_id: "${seedId}"\ngenerated: "${date}"\nprotocol: "MirrorDNA-Seed-v2"\nintegrity:\n  checksum: "${checksum}"\n  algo: "sha256"`;

            const fullSeed = `---\n${frontmatter}\n---\n\n${body}`;
            
            document.getElementById('seedOutput').value = fullSeed;
            document.getElementById('output-area').style.display = 'block';
            navigator.clipboard.writeText(fullSeed);
        }

        async function verifySeed() {
            const input = document.getElementById('verifyInput').value;
            const resBox = document.getElementById('verifyResult');
            
            if (!input.trim()) return;

            const result = MirrorParser.parse(input);
            resBox.style.display = 'block';

            if (!result.valid) {
                resBox.innerHTML = `<div class="status-header status-fail"><div class="status-title">❌ Invalid Format</div></div><div>${result.error}</div>`;
                return;
            }

            // Checksum Validation
            const declaredSum = result.frontmatter.checksum || (result.frontmatter.integrity ? result.frontmatter.integrity.checksum : null); // Simple parser handling
            
            // Since our simple YAML parser might flatten structure depending on implementation, 
            // for v2 prototype let's assume flat or check text search if strict parse fails.
            // Actually, let's re-parse to be safe on the specific integrity line if needed.
            // For this demo, let's just grab the content and re-hash.
            
            const computedSum = await computeChecksum(result.content);
            
            // Extract declared checksum manually if parser was loose
            let cleanDeclared = declaredSum;
            if (!cleanDeclared) {
                const match = input.match(/checksum:\s*"?(sha256:[a-f0-9]+)"?/);
                if (match) cleanDeclared = match[1];
            }

            if (cleanDeclared === computedSum) {
                 resBox.innerHTML = `
                    <div class="status-header status-pass">
                        <div class="status-icon">✓</div>
                        <div class="status-title">Integrity Verified</div>
                    </div>
                    <div class="detail-row"><span class="detail-label">Seed ID</span><span class="detail-val">${result.frontmatter.seed_id}</span></div>
                    <div class="detail-row"><span class="detail-label">Protocol</span><span class="detail-val">${result.frontmatter.protocol}</span></div>
                    <div class="detail-row"><span class="detail-label">Checksum</span><span class="detail-val">${computedSum.substring(0, 16)}...</span></div>
                 `;
            } else {
                 resBox.innerHTML = `
                    <div class="status-header status-fail">
                        <div class="status-icon">⚠️</div>
                        <div class="status-title">Integrity Mismatch</div>
                    </div>
                    <div class="warning-box">The file content does not match its signature. It may have been modified.</div>
                    <div class="detail-row"><span class="detail-label">Computed</span><span class="detail-val">${computedSum.substring(0, 16)}...</span></div>
                    <div class="detail-row"><span class="detail-label">Declared</span><span class="detail-val">${cleanDeclared ? cleanDeclared.substring(0, 16)+'...' : 'None'}</span></div>
                 `;
            }
        }
    </script>
</body>
</html>
