<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Seed v5 | Holographic Sovereignty</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #020202;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #00ff94;
            --accent-glow: rgba(0, 255, 148, 0.3);
            --text: #fff;
            --text-dim: rgba(255, 255, 255, 0.5)
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 255, 148, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 40%);
            overflow: hidden;
        }

        /* Container: The "Monolith" Layout */
        .container {
            display: flex;
            width: 1100px;
            height: 700px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        /* Left: Editor */
        .editor-side {
            width: 450px;
            padding: 3rem;
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 2;
            background: rgba(0, 0, 0, 0.2);
        }

        .brand {
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group {
            margin-bottom: 2rem;
            opacity: 0;
            animation: slideIn 0.5s ease forwards;
        }

        .input-group:nth-child(2) {
            animation-delay: 0.1s;
        }

        .input-group:nth-child(3) {
            animation-delay: 0.2s;
        }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        input,
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--glass-border);
            padding: 0.5rem 0;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: none;
            min-height: 80px;
        }

        /* Right: The Artifact */
        .artifact-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.02) 0%, transparent 70%);
        }

        .canvas-wrapper {
            position: relative;
            padding: 20px;
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            /* Frame look */
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .canvas-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            width: 350px;
            height: 450px;
            /* ID Card Ratio */
            background: #000;
        }

        .meta-data {
            margin-top: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
            opacity: 0.6;
        }

        .download-btn {
            margin-top: 2rem;
            padding: 1rem 3rem;
            background: var(--text);
            color: #000;
            border: none;
            border-radius: 100px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0.5;
            pointer-events: none;
        }

        .download-btn.ready {
            opacity: 1;
            pointer-events: auto;
        }

        .download-btn:hover {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* Drag Overlay */
        .drop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .drop-active .drop-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .drop-text {
            color: var(--accent);
            font-family: 'JetBrains Mono';
            letter-spacing: 0.2em;
            margin-top: 1rem;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes pulse {
            0% {
                opacity: 0.3
            }

            50% {
                opacity: 0.6
            }

            100% {
                opacity: 0.3
            }
        }
    </style>
</head>

<body id="body">

    <div class="drop-overlay">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <div class="drop-text">DECODE HOLOGRAPHIC SEED</div>
    </div>

    <div class="container">
        <!-- FORM -->
        <div class="editor-side">
            <div class="brand">
                <span style="font-size:1.5rem">⟡</span> MIRROR <span style="opacity:0.5">v5.0</span>
            </div>

            <div class="input-group">
                <label>Identity Name</label>
                <input type="text" id="name" placeholder="Name or Designation" autocomplete="off"
                    oninput="updateHologram()">
            </div>

            <div class="input-group">
                <label>Function / Role</label>
                <input type="text" id="role" placeholder="System Role" autocomplete="off" oninput="updateHologram()">
            </div>

            <div class="input-group">
                <label>Essence bio</label>
                <textarea id="bio" placeholder="Who resides within the reflection?"
                    oninput="updateHologram()"></textarea>
            </div>

            <div style="margin-top: auto; font-size: 0.7rem; color: var(--text-dim); line-height: 1.6;">
                The resulting image is Steganographically Encoded.<br>
                It holds your full cryptographic identity.<br>
                <span style="color:var(--accent)">Drag existing images here to unlock.</span>
            </div>
        </div>

        <!-- VISUAL -->
        <div class="artifact-side">
            <div class="canvas-wrapper">
                <canvas id="viz" width="350" height="450"></canvas>
            </div>

            <div class="meta-data" id="status">INITIATING VISUAL CORE...</div>

            <button class="download-btn" id="dlBtn" onclick="downloadArtifact()">Mint Hologram</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('viz');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const W = canvas.width;
        const H = canvas.height;

        // --- STEGANOGRAPHY CORE ---

        // Convert string to binary string
        function strToBin(str) {
            return str.split('').map(char =>
                char.charCodeAt(0).toString(2).padStart(8, '0')
            ).join('') + '00000000'; // Null terminator
        }

        function binToStr(bin) {
            const bytes = bin.match(/.{1,8}/g);
            let str = '';
            for (let b of bytes) {
                if (b === '00000000') break; // End
                str += String.fromCharCode(parseInt(b, 2));
            }
            return str;
        }

        // Hide data in LSB of Red channel (simplest approach for v5 demo)
        function steganographyEncode(ctx, text) {
            const imgData = ctx.getImageData(0, 0, W, H);
            const data = imgData.data;
            const binary = strToBin(text);

            if (binary.length > data.length / 4) {
                console.error("Data too large for image");
                return;
            }

            for (let i = 0; i < binary.length; i++) {
                let pixelIndex = i * 4; // Use every pixel
                // Clear LSB
                data[pixelIndex] &= ~1;
                // Set LSB
                if (binary[i] === '1') {
                    data[pixelIndex] |= 1;
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function steganographyDecode(ctx) {
            const imgData = ctx.getImageData(0, 0, W, H);
            const data = imgData.data;
            let binary = '';

            // Limit read to reasonable size to prevent lockup on empty noise
            // Max text: 10KB ~ 81k bits
            const maxBits = 100000;

            for (let i = 0; i < data.length && i < maxBits; i++) {
                let pixelIndex = i * 4;
                binary += (data[pixelIndex] & 1).toString();
            }

            try {
                return binToStr(binary);
            } catch (e) {
                return null;
            }
        }

        // --- GENERATIVE ART (The "Hologram") ---

        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function generateHologram(seedStr) {
            // Hash seed to get unique number
            let hash = 0;
            for (let i = 0; i < seedStr.length; i++) hash = seedStr.charCodeAt(i) + ((hash << 5) - hash);

            // Clear
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, W, H);

            // Draw Abstract Geom
            let r = Math.abs(hash);

            // Gradient Background
            const grd = ctx.createLinearGradient(0, 0, W, H);
            grd.addColorStop(0, `hsl(${r % 360}, 60%, 10%)`);
            grd.addColorStop(1, `hsl(${(r + 180) % 360}, 60%, 5%)`);
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, W, H);

            // Lines / Data beams
            ctx.lineWidth = 1;
            for (let i = 0; i < 20; i++) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(255,255,255, ${seededRandom(r + i) * 0.1})`;
                ctx.moveTo(0, seededRandom(r + i) * H);
                ctx.lineTo(W, seededRandom(r + i + 100) * H);
                ctx.stroke();
            }

            // Central "Chip" or Icon
            ctx.strokeStyle = `hsl(${r % 360}, 80%, 60%)`;
            ctx.lineWidth = 2;
            const cx = W / 2, cy = H / 2 - 20;
            const size = 60 + seededRandom(r) * 40;

            ctx.strokeRect(cx - size / 2, cy - size / 2, size, size);

            // Text Details on Image
            ctx.fillStyle = '#fff';
            ctx.font = '600 16px Inter';
            ctx.textAlign = 'center';
            ctx.fillText((document.getElementById('name').value || 'IDENTITY').toUpperCase(), W / 2, H - 60);

            ctx.font = '400 10px JetBrains Mono';
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillText((document.getElementById('role').value || 'UNASSIGNED').toUpperCase(), W / 2, H - 40);

            // Watermark
            ctx.font = '10px JetBrains Mono';
            ctx.fillStyle = '#00ff94';
            ctx.textAlign = 'right';
            ctx.fillText('⟡ MIRROR SEED v5', W - 20, 30);
        }

        // --- APP LOGIC ---

        function updateHologram() {
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const bio = document.getElementById('bio').value;

            const hasData = name || role || bio;

            document.getElementById('dlBtn').classList.toggle('ready', hasData);
            document.getElementById('status').innerText = hasData ?
                `HOLOGRAM GENERATED :: ${(name + role + bio).length} BYTES` :
                "AWAITING INPUT...";

            const seedStr = name + role + bio;
            generateHologram(seedStr || "MIRROR");
        }

        async function downloadArtifact() {
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const bio = document.getElementById('bio').value;

            // Build Markdown (Standard v3/v4 Format)
            const md = `# MIRROR SEED v5\n\n## Identity\nName: ${name}\nRole: ${role}\nBio: ${bio}\n\n---\n⟡ MirrorDNA-Holographic-v5`;

            // Add Hash/Signature
            const encoder = new TextEncoder();
            const data = encoder.encode(md);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const checksum = 'sha256:' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            const payload = `---\nchecksum: "${checksum}"\n---\n${md}`;

            // ENCODE into Image
            steganographyEncode(ctx, payload);

            // Download Canvas
            const link = document.createElement('a');
            link.download = `mirror-seed-v5-${name.replace(/\s/g, '-').toLowerCase()}.png`;
            link.href = canvas.toDataURL();
            link.click();

            // Re-render visual to clear noise (optional, but clean)
            setTimeout(() => updateHologram(), 100);
        }

        // --- RE-HYDRATION ---

        const dropZone = document.body;

        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drop-active'); });
        dropZone.addEventListener('dragleave', e => {
            e.preventDefault();
            if (e.relatedTarget === null) dropZone.classList.remove('drop-active');
        });

        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drop-active');

            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        // Draw image to canvas to read data
                        ctx.drawImage(img, 0, 0, W, H);

                        // DECODE
                        const decoded = steganographyDecode(ctx);
                        if (decoded && decoded.includes('MIRROR SEED')) {
                            hydrateIterface(decoded);
                            alert("⟡ HOLOGRAM DECODED SUCCESSFULLY");
                        } else {
                            alert("⚠️ No MirrorDNA found in this image.");
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function hydrateIterface(md) {
            const parse = (regex) => (md.match(regex) || [])[1] || '';
            document.getElementById('name').value = parse(/Name:\s*(.+)/);
            document.getElementById('role').value = parse(/Role:\s*(.+)/);
            document.getElementById('bio').value = parse(/Bio:\s*(.+)/);
            updateHologram();
        }

        // Init
        updateHologram();

    </script>
</body>

</html>
