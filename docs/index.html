<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Set up Active Mirror in about a minute, keep it local to your browser, and start with better reflection."
  >
  <meta property="og:title" content="Make Active Mirror yours">
  <meta property="og:description" content="A quick private setup that helps Active Mirror ask better questions and give better next moves.">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://activemirror.ai/app/start/">
  <title>Make Active Mirror yours</title>
  <style>
    :root {
      color-scheme: dark;
      background: #050507;
      color: #f7f7f8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.2), transparent 42%),
        #050507;
    }

    main {
      width: min(100%, 520px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 34px;
      background: rgba(255, 255, 255, 0.045);
      box-shadow: 0 0 80px rgba(124, 58, 237, 0.14);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 76px);
      line-height: 0.92;
      letter-spacing: -0.06em;
    }

    p {
      margin: 18px 0 0;
      color: #a1a1aa;
      font-size: 17px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      margin-top: 28px;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      padding: 0 22px;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      color: #fff;
      font-weight: 750;
      text-decoration: none;
    }
  </style>
  <script>
    window.setTimeout(() => {
      window.location.replace("https://activemirror.ai/app/start/");
    }, 1200);
  </script>
</head>
<body>
  <main>
    <h1>Make Active Mirror yours.</h1>
    <p>A quick private setup helps Active Mirror ask better questions, give better next moves, and remember only what you choose.</p>
    <a href="https://activemirror.ai/app/start/">Start setup</a>
  </main>
</body>
</html>
