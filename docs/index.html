<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Mirror Identity | ~active-mirror-paul</title>
    <meta name="description" content="Sovereign Identity Anchor for Paul Desai. Active Mirror Protocol v1.0.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #00ff9d;
            --text-main: #e0e0e0;
            --text-dim: #808080;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 157, 0.03) 0%, transparent 50%);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            height: 85vh;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            display: grid;
            grid-template-columns: 250px 1fr;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Sidebar */
        .sidebar {
            border-right: 1px solid var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            margin-bottom: 15px;
            background: url('https://avatars.githubusercontent.com/u/189563222?v=4') center/cover;
        }

        .handle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            text-align: left;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-color: var(--glass-border);
        }

        .nav-btn.active {
            color: var(--accent);
            border-color: rgba(0, 255, 157, 0.3);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: auto;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        /* Content Area */
        .content {
            padding: 40px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
        }

        h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--text-main); }
        h2 { font-size: 1.2rem; margin-top: 30px; margin-bottom: 15px; color: var(--accent); }
        p { margin-bottom: 15px; color: #ccc; }
        li { margin-bottom: 8px; margin-left: 20px; color: #ccc; }
        code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: var(--accent); }
        pre { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; overflow-x: auto; margin-bottom: 20px; border: 1px solid var(--glass-border); }
        a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
        
        .copy-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Inter', sans-serif;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; height: 100vh; width: 100%; border-radius: 0; }
            .sidebar { display: none; } /* Simplified for mobile demo */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="profile">
                <div class="avatar"></div>
                <div class="handle">~active-mirror-paul</div>
                <div class="name">Paul Desai</div>
            </div>
            
            <nav>
                <button class="nav-btn active" onclick="loadContent('boot')">⟡ BOOT.md</button>
                <button class="nav-btn" onclick="loadContent('system')">⧈ System Kernel</button>
                <button class="nav-btn" onclick="loadContent('now')">⧉ Live State</button>
                <button class="nav-btn" onclick="loadContent('identity')">{} JSON Profile</button>
            </nav>

            <div class="status-indicator">
                <div class="dot"></div>
                <span>Active Mirror Online</span>
            </div>
        </div>

        <div class="content" id="main-display">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        const repoBase = 'https://raw.githubusercontent.com/MirrorDNA-Reflection-Protocol/active-mirror-identity/main/';

        const contentMap = {
            'boot': {
                title: 'Universal Bootloader',
                file: 'BOOT.md',
                desc: 'Copy this prompt to align any AI immediately.'
            },
            'system': {
                title: 'System Kernel',
                file: 'system.md',
                desc: 'Operating protocols and cognitive stance.'
            },
            'now': {
                title: 'Live State',
                file: 'now.md',
                desc: 'Current context, location, and focus.'
            },
            'identity': {
                title: 'Machine Profile',
                file: 'identity.json',
                desc: 'Structured data for autonomous agents.'
            }
        };

        async function loadContent(key) {
            // Update active button
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const item = contentMap[key];
            const display = document.getElementById('main-display');
            
            display.innerHTML = `<div style="color: var(--text-dim)">Loading ${item.file}...</div>`;

            try {
                const response = await fetch(repoBase + item.file);
                const text = await response.text();
                
                // Simple Markdown rendering (very basic for zero-dep)
                let html = text
                    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                    .replace(/\*\*(.*)\*\*/gim, '<b>$1</b>')
                    .replace(/\`(.*)\`/gim, '<code>$1</code>')
                    .replace(/\n/gim, '<br>');

                if (key === 'identity') {
                    html = `<pre><code>${text}</code></pre>`;
                }

                display.innerHTML = `
                    <div style="margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 20px;">
                        <h1>${item.title}</h1>
                        <p style="color: var(--text-dim)">${item.desc}</p>
                        ${key === 'boot' ? '<button class="copy-btn" onclick="copyBoot()">Copy Prompt</button>' : ''}
                    </div>
                    <div>${html}</div>
                `;
            } catch (e) {
                display.innerHTML = `Error loading content: ${e.message}`;
            }
        }

        function copyBoot() {
            fetch(repoBase + 'BOOT.md').then(r => r.text()).then(text => {
                const prompt = text.split('---')[1]; // Get content after separator
                navigator.clipboard.writeText(prompt);
                alert('Bootloader copied to clipboard!');
            });
        }

        // Init
        loadContent('boot');
    </script>
</body>
</html>
