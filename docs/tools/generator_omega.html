<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Seed Omega | The Final Standard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #030303;
            --panel: rgba(20, 20, 20, 0.6);
            --border: rgba(255, 215, 0, 0.15);
            --text: #e0e0e0;
            --text-dim: rgba(255, 255, 255, 0.4);
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.3);
            --gold-glow: rgba(255, 215, 0, 0.15);
            --success: #00ff94
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Subtle Golden Dust Background */
            background-image: radial-gradient(circle at 50% -20%, rgba(255, 215, 0, 0.08), transparent 70%);
        }

        /* The Monolith Container */
        .monolith {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 750px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            backdrop-filter: blur(40px);
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.8), 0 0 20px var(--gold-glow);
            position: relative;
            margin: 2rem;
            flex-wrap: wrap;
            /* Allow wrapping on small screens */
            overflow: hidden;
        }

        /* Responsive Adjustments */
        @media (max-width: 900px) {
            body {
                height: auto;
                padding: 1rem;
                overflow-y: auto;
                background-attachment: fixed;
            }

            .monolith {
                height: auto;
                flex-direction: column;
                width: 100%;
                margin: 0;
                overflow: visible;
            }

            .panel-left {
                width: 100% !important;
                border-right: none !important;
                border-bottom: 1px solid var(--border);
                padding: 2rem !important;
            }

            .panel-right {
                width: 100%;
                padding: 3rem 1rem;
                min-height: 600px;
            }

            canvas {
                width: 100%;
                max-width: 350px;
                height: auto;
                aspect-ratio: 350/450;
            }
        }

        /* Left: Editor (The Input) */
        .panel-left {
            width: 40%;
            min-width: 350px;
            padding: 4rem;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .header {
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--gold);
            opacity: 0.9;
        }

        .subtitle {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chain-badge {
            font-family: 'JetBrains Mono';
            font-size: 0.6rem;
            padding: 2px 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .chain-badge.active {
            opacity: 1;
            color: var(--gold);
            border-color: var(--gold-dim);
        }

        .form-group {
            margin-bottom: 2.5rem;
            position: relative;
        }

        .form-group label {
            position: absolute;
            top: -1.2rem;
            left: 0;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-dim);
            transition: 0.3s;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 0;
            font-family: inherit;
            font-size: 1.25rem;
            color: var(--text);
            outline: none;
            transition: 0.3s;
        }

        .form-group textarea {
            font-size: 1rem;
            line-height: 1.6;
            min-height: 60px;
            resize: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
        }

        .form-group:focus-within label {
            color: var(--gold);
        }

        .ancestry-info {
            margin-top: auto;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            font-family: 'JetBrains Mono';
            font-size: 0.65rem;
            color: var(--text-dim);
            line-height: 1.8;
        }

        .hash-disp {
            color: var(--gold);
            opacity: 0.8;
            word-break: break-all;
        }

        /* Right: The Hologram (The Output) */
        .panel-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.01), transparent 50%);
        }

        .canvas-frame {
            padding: 20px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .canvas-frame::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border: 1px solid var(--gold);
            opacity: 0.1;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 350px;
            height: 450px;
            background: #000;
        }

        .actions {
            margin-top: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .btn-forge {
            padding: 1rem 3rem;
            background: var(--gold);
            color: #000;
            border: none;
            font-family: 'Space Grotesk';
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0.5;
            pointer-events: none;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .btn-forge.ready {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-forge:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--gold-glow);
        }

        .status-txt {
            font-family: 'JetBrains Mono';
            font-size: 0.7rem;
            color: var(--text-dim);
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Drag Overlay */
        .drag-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .drag-active .drag-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .drag-msg {
            color: var(--gold);
            font-family: 'JetBrains Mono';
            font-size: 1.5rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
    </style>
</head>

<body id="body">

    <div class="drag-overlay">
        <div class="drag-msg">LINK TO ANCESTRY</div>
        <div style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-dim); font-family: 'JetBrains Mono'">Import
            Previous Seed to Forge Chain</div>
    </div>

    <div class="monolith">
        <!-- LEFT: INPUT LAYER -->
        <div class="panel-left">
            <div class="header">
                <div class="logo">⟡</div>
                <div class="title">Mirror Seed Omega</div>
                <div class="subtitle">
                    PROTOCOL 6.0
                    <div id="chainBadge" class="chain-badge">CHAIN ACTIVE</div>
                </div>
            </div>

            <div class="form-group">
                <label>Designation (Name)</label>
                <input type="text" id="name" placeholder="Enter Name..." autocomplete="off" oninput="updateCore()">
            </div>
            <div class="form-group">
                <label>Function (Role)</label>
                <input type="text" id="role" placeholder="System Role..." autocomplete="off" oninput="updateCore()">
            </div>
            <div class="form-group">
                <label>Essence (Bio)</label>
                <textarea id="bio" placeholder="Who are you in this moment?" oninput="updateCore()"></textarea>
            </div>

            <div class="ancestry-info">
                <div>PARENT HASH (ANCESTRY):</div>
                <div id="parentDisp" class="hash-disp">NULL (GENESIS SEED)</div>
                <div style="margin-top: 0.5rem">Drag a previous seed image here to link your history and prove
                    evolution.</div>
            </div>
        </div>

        <!-- RIGHT: OUTPUT LAYER -->
        <div class="panel-right">
            <div class="canvas-frame">
                <canvas id="viz" width="350" height="450"></canvas>
            </div>

            <div class="actions">
                <div id="status" class="status-txt">READY TO FORGE</div>
                <button id="forgeBtn" class="btn-forge" onclick="forgeArtifact()">FORGE OMEGA ARTIFACT</button>
            </div>
        </div>
    </div>

    <script>
        // --- OMEGA CORE STATE ---
        const STATE = {
            parentHash: null, // The hash of the IMPORTED seed
            data: { name: '', role: '', bio: '' }
        };

        const canvas = document.getElementById('viz');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const W = canvas.width, H = canvas.height;

        // --- STEGANOGRAPHY ENGINE (Review v5 logic - LSB Red Channel) ---
        function strToBin(str) {
            return str.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join('') + '00000000';
        }

        function binToStr(bin) {
            const bytes = bin.match(/.{1,8}/g);
            let str = ''; for (let b of bytes) { if (b === '00000000') break; str += String.fromCharCode(parseInt(b, 2)); } return str;
        }

        function encodeStego(ctx, text) {
            const imgData = ctx.getImageData(0, 0, W, H);
            const d = imgData.data;
            const bin = strToBin(text);
            if (bin.length > d.length / 4) return false;
            for (let i = 0; i < bin.length; i++) {
                let p = i * 4;
                d[p] &= ~1; if (bin[i] === '1') d[p] |= 1;
            }
            ctx.putImageData(imgData, 0, 0);
            return true;
        }

        function decodeStego(ctx) {
            const d = ctx.getImageData(0, 0, W, H).data;
            let bin = '';
            for (let i = 0; i < 300000; i++) { // Limit scan
                let p = i * 4; if (p >= d.length) break;
                bin += (d[p] & 1).toString();
            }
            try { return binToStr(bin); } catch (e) { return null; }
        }

        // --- HOLOGRAPHIC RENDERER (Golden Theme) ---
        function seededRandom(s) { let x = Math.sin(s++) * 10000; return x - Math.floor(x); }

        function renderHologram(str, isLinked) {
            // Hash for randomness
            let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            let r = Math.abs(hash);

            // BG: Deep Void
            ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);

            // Gold/Void Gradient
            const grd = ctx.createLinearGradient(0, 0, W, H);
            grd.addColorStop(0, '#0a0a0a');
            grd.addColorStop(1, '#111');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

            // Tech Lines
            ctx.lineWidth = 1;
            for (let i = 0; i < 30; i++) {
                ctx.beginPath();
                // If linked, lines are Gold. If Genesis, lines are White/Teal.
                let hue = isLinked ? 50 : 160;
                let sat = isLinked ? '100%' : '0%';
                let alpha = seededRandom(r + i) * 0.15;
                ctx.strokeStyle = `hsla(${hue}, ${sat}, 50%, ${alpha})`;

                let x = seededRandom(r + i * 2) * W;
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }

            // The Core Geometry
            const cx = W / 2, cy = H / 2 - 20;
            const size = 80 + seededRandom(r) * 40;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(seededRandom(r + 5));
            ctx.strokeStyle = '#ffd700'; // Gold
            ctx.lineWidth = 2;
            ctx.strokeRect(-size / 2, -size / 2, size, size);

            // Inner Core
            if (isLinked) {
                // If linked, draw a secondary connected square (The "Chain")
                ctx.strokeStyle = 'rgba(255,215,0,0.5)';
                ctx.rotate(Math.PI / 4);
                ctx.strokeRect(-size / 3, -size / 3, size / 1.5, size / 1.5);
            }
            ctx.restore();

            // Text
            ctx.fillStyle = '#fff';
            ctx.font = '700 18px Space Grotesk';
            ctx.textAlign = 'center';
            ctx.fillText((document.getElementById('name').value || 'OMEGA').toUpperCase(), W / 2, H - 70);

            ctx.font = '400 10px JetBrains Mono';
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillText(isLinked ? "CHAIN ID: VERIFIED" : "GENESIS BLOCK", W / 2, H - 50);
        }

        // --- LOGIC ---

        function updateCore() {
            STATE.data.name = document.getElementById('name').value;
            STATE.data.role = document.getElementById('role').value;
            STATE.data.bio = document.getElementById('bio').value;

            const hasData = STATE.data.name && STATE.data.role;
            const btn = document.getElementById('forgeBtn');
            const status = document.getElementById('status');

            if (hasData) {
                btn.classList.add('ready');
                status.innerText = "ARTIFACT READY";
                status.style.opacity = 1;
            } else {
                btn.classList.remove('ready');
                status.style.opacity = 0;
            }

            const seedStr = STATE.data.name + STATE.data.role + STATE.data.bio + (STATE.parentHash || '');
            renderHologram(seedStr, !!STATE.parentHash);
        }

        async function computeChecksum(content) {
            const enc = new TextEncoder();
            const hash = await crypto.subtle.digest('SHA-256', enc.encode(content));
            return 'sha256:' + Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function forgeArtifact() {
            const d = STATE.data;
            // 1. Construct Temporal Payload
            const frontmatter = `version: "6.0-omega"
seed_id: "seed-${Date.now().toString(36)}"
parent_hash: ${STATE.parentHash ? '"' + STATE.parentHash + '"' : 'null'}
generated: "${new Date().toISOString()}"
protocol: "MirrorDNA-Omega"
integrity:
  checksum: "PENDING"
  algo: "sha256"
  quantum_reserved: null`;

            const body = `# MIRROR SEED OMEGA

## Identity
Name: ${d.name}
Role: ${d.role}
Bio: ${d.bio}

---\n⟡ MirrorDNA-Omega`;

            // 2. Compute Integrity (Self-referential requires care, usually we hash body + partial frontmatter, keeping it simple here)
            // Strategy: We hash the BODY + Header-without-checksum.
            const rawPayload = frontmatter + '\n---\n\n' + body; // Temp
            const checksum = await computeChecksum(body); // Checksum of BODY typically

            const finalFrontmatter = frontmatter.replace('PENDING', checksum);
            const finalDoc = `---\n${finalFrontmatter}\n---\n\n${body}`;

            // 3. Encode into Visuals
            encodeStego(ctx, finalDoc);

            // 4. Download
            const a = document.createElement('a');
            a.download = `omega-seed-${d.name.split(' ')[0].toLowerCase()}.png`;
            a.href = canvas.toDataURL();
            a.click();
        }

        // --- RE-HYDRATION & CHAIN LINKING ---
        const dropZone = document.body;
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-active'); });
        dropZone.addEventListener('dragleave', e => { e.preventDefault(); if (e.relatedTarget === null) dropZone.classList.remove('drag-active'); });
        dropZone.addEventListener('drop', e => {
            e.preventDefault(); dropZone.classList.remove('drag-active');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const r = new FileReader();
                r.onload = ev => {
                    const img = new Image();
                    img.onload = async () => {
                        // 1. Draw to Read
                        ctx.drawImage(img, 0, 0, W, H);
                        // 2. Decode
                        const decoded = decodeStego(ctx);
                        if (decoded && decoded.includes('MIRROR SEED')) {
                            // 3. COMPUTE HASH for CHAINING (This is the parent hash now)
                            const parentHash = await computeChecksum(decoded); // Hash of the whole previous file content is ideal, or just body. Let's use the file content we extracted.

                            STATE.parentHash = parentHash;

                            // 4. Update UI
                            document.getElementById('parentDisp').innerText = parentHash.substring(0, 24) + '...';
                            document.getElementById('chainBadge').classList.add('active');

                            // 5. Parse Data to pre-fill (Hyderation)
                            const parse = (regex) => (decoded.match(regex) || [])[1] || '';
                            document.getElementById('name').value = parse(/Name:\s*(.+)/);
                            document.getElementById('role').value = parse(/Role:\s*(.+)/);
                            document.getElementById('bio').value = parse(/Bio:\s*(.+)/);

                            updateCore();
                            // alert("🔗 TEMPORAL CHAIN LINKED\n\nAncestry verified. New seed will inherit this lineage.");
                        } else {
                            alert("❌ Invalid Seed Image");
                        }
                    };
                    img.src = ev.target.result;
                };
                r.readAsDataURL(file);
            }
        });

        // Init
        updateCore();

    </script>
</body>

</html>
