<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Mirror Identity Generator — Create Your AI Identity</title>
    <meta name="description" content="Generate your personal AI identity in 60 seconds. Make any AI remember you.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #16161e;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-top: 2rem;
        }

        .logo-glyph {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 2rem;
            margin: 1rem 0 0.5rem;
            letter-spacing: -0.02em;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .form-section {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-section h3 {
            color: var(--accent-primary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        button {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        #output {
            display: none;
            margin-top: 2rem;
        }

        #output.visible {
            display: block;
        }

        .output-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            color: var(--text-secondary);
        }

        .copy-btn {
            margin-top: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        .copy-btn:hover {
            background: var(--accent-primary);
            color: white;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        footer a {
            color: var(--accent-primary);
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo-glyph">⟡</div>
            <h1>Active Mirror Identity</h1>
            <p class="tagline">Generate your AI identity in 60 seconds</p>
        </header>

        <form id="identityForm">
            <div class="form-section">
                <h3>⟡ Who You Are</h3>
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="e.g., Paul Desai" required>

                <div class="form-row">
                    <div>
                        <label for="role">Primary Role</label>
                        <input type="text" id="role" placeholder="e.g., Founder, Engineer, Researcher">
                    </div>
                    <div>
                        <label for="location">Location</label>
                        <input type="text" id="location" placeholder="e.g., Goa, India">
                    </div>
                </div>

                <label for="org">Organization (optional)</label>
                <input type="text" id="org" placeholder="e.g., N1 Intelligence">
            </div>

            <div class="form-section">
                <h3>△ How You Work</h3>
                <label for="style">Communication Style</label>
                <select id="style">
                    <option value="direct">Direct & Concise</option>
                    <option value="detailed">Detailed & Thorough</option>
                    <option value="casual">Casual & Friendly</option>
                    <option value="formal">Formal & Professional</option>
                </select>

                <label for="preferences">Work Preferences</label>
                <textarea id="preferences"
                    placeholder="e.g., I prefer code examples over explanations. I work late at night. I value efficiency over perfection."></textarea>
            </div>

            <div class="form-section">
                <h3>◈ What You're Building</h3>
                <label for="projects">Current Projects</label>
                <textarea id="projects"
                    placeholder="e.g., Building sovereign AI infrastructure. Working on SCD Protocol. Maintaining 64 open-source repos."></textarea>

                <label for="stack">Tech Stack</label>
                <input type="text" id="stack" placeholder="e.g., Python, TypeScript, Mac, Ollama, Claude">
            </div>

            <div class="form-section">
                <h3>⧉ AI Preferences</h3>
                <label for="ai_rules">Rules for AI (what AI should always do or never do)</label>
                <textarea id="ai_rules"
                    placeholder="e.g., Never apologize unnecessarily. Always show code first. Ask before making major changes."></textarea>
            </div>

            <button type="submit">⟡ Generate Identity</button>
        </form>

        <div id="output">
            <h3 style="margin-bottom: 1rem; color: var(--text-primary);">Your Identity Kernel</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1rem; font-size: 0.9rem;">
                Copy this and paste it as custom instructions in Claude, Gemini, ChatGPT, or any AI assistant.
            </p>
            <div class="output-box" id="outputText"></div>
            <button class="copy-btn" onclick="copyOutput()">📋 Copy to Clipboard</button>
        </div>
    </div>

    <footer>
        <p>Part of <a href="https://mirrordna-reflection-protocol.github.io/MirrorDNA-Docs/">MirrorDNA</a></p>
        <p style="margin-top: 0.5rem;">Built by <a href="https://github.com/MirrorDNA-Reflection-Protocol">Paul
                Desai</a></p>
    </footer>

    <script>
        document.getElementById('identityForm').addEventListener('submit', function (e) {
            e.preventDefault();
            generateIdentity();
        });

        function generateIdentity() {
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const location = document.getElementById('location').value;
            const org = document.getElementById('org').value;
            const style = document.getElementById('style').value;
            const preferences = document.getElementById('preferences').value;
            const projects = document.getElementById('projects').value;
            const stack = document.getElementById('stack').value;
            const aiRules = document.getElementById('ai_rules').value;

            const styleMap = {
                'direct': 'Be direct and concise. Skip unnecessary pleasantries.',
                'detailed': 'Provide thorough explanations with context.',
                'casual': 'Keep it casual and friendly. Use conversational tone.',
                'formal': 'Maintain professional, formal communication.'
            };

            let output = `# Identity Kernel for ${name}

## Who I Am
- **Name:** ${name}`;

            if (role) output += `\n- **Role:** ${role}`;
            if (location) output += `\n- **Location:** ${location}`;
            if (org) output += `\n- **Organization:** ${org}`;

            output += `\n
## Communication Style
${styleMap[style]}`;

            if (preferences) {
                output += `\n
## Work Preferences
${preferences}`;
            }

            if (projects) {
                output += `\n
## Current Projects
${projects}`;
            }

            if (stack) {
                output += `\n
## Tech Stack
${stack}`;
            }

            if (aiRules) {
                output += `\n
## Rules for AI
${aiRules}`;
            }

            output += `\n
---
⟡ Generated by Active Mirror Identity
https://id.activemirror.ai/`;

            document.getElementById('outputText').textContent = output;
            document.getElementById('output').classList.add('visible');
            document.getElementById('output').scrollIntoView({ behavior: 'smooth' });
        }

        function copyOutput() {
            const text = document.getElementById('outputText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✓ Copied!';
                setTimeout(() => {
                    btn.textContent = '📋 Copy to Clipboard';
                }, 2000);
            });
        }
    </script>
</body>

</html>
