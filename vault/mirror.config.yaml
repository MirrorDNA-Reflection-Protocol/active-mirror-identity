mirror_id: MirrorAgent-Ø
vault_root: ~/Dropbox/Vault
contexts:
  primary:
    path: Primary
    mode: read_only
  scd:
    path: SCD
    mode: read_only
    required: true
guards:
  verify_checksum: true
  max_scd_tokens: 180
  fallback_snapshot: Primary/Continuity_Snapshot.md
  writeback:
    drafts_outbox: _inbox/drafts
    allow_overwrite: false
ui:
  debounce_ms: 1500
  notify_on_checksum_mismatch: true
